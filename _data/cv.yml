    Current Research Projects:
      - bullet: "**On the publication stage —** *[Echoes of the American Civil War Abroad: Perceptions, Identities, and Historical Memory](https://www.bloomsbury.com/us/echoes-of-the-american-civil-war-abroad-9781666920314/)*, coedited with Victoria I. Zhuravleva (Bloomsbury, forthcoming September 2026)."

      - bullet: "**On the publication stage —** *Americans and All the Rest: Identity and Foreign Policy in U.S. History* — English translation of the Prosvetitel-winning Russian original (Palgrave Macmillan, forthcoming June 2026)."

      - bullet: "**On the research stage —** *Routledge Handbook of Contemporary Russian History*, co-edited with Vladimir Gel'man and Sari Autio-Sarasmo (both Helsinki University, Finland), under contract with Routledge."

      - bullet: "**On the research stage —** *Russia and the American Civil War* — book-length project."

