    Academic Persecution and Current Status:
      - bullet: 'In **March 2024**, dismissed from the European University at St. Petersburg after publicly opposing Russia''s war against Ukraine and signing an anti-war petition. The dismissal was formally justified as "absenteeism," despite an approved sabbatical to work at a U.S. institution. [The Moscow Times, 5 March 2024](https://www.themoscowtimes.com/2024/03/05/anti-war-historian-fired-from-st-petersburgs-european-university-a84342).'
      - bullet: 'In **January 2026**, designated a "foreign agent" by the Russian Ministry of Justice. The status imposes severe legal and professional restrictions, including a ban on teaching and public educational activity, financial reporting requirements, and limitations on receiving income from intellectual work. [RASA statement of support](https://t-invariant.org/2026/01/rasa-statement-in-support-of-professor-ivan-kurilla/).'

